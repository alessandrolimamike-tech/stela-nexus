name: Gerar APK da Stela Nexus
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Pegar arquivos do projeto
        uses: actions/checkout@v4

      - name: Atualizar sistema
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y

      - name: Instalar TODAS as dependências
        run: |
          sudo apt install -y zip unzip openjdk-17-jdk zlib1g-dev libncurses5-dev libtinfo6 cmake libffi-dev libssl-dev autoconf automake libtool pkg-config libaidl-dev git

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar ferramentas de compilação
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.37

      - name: Aceitar licenças do Android
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

      - name: Gerar APK
        run: buildozer android debug

      - name: Salvar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: Stela-Nexus-APK
          path: bin/*.apk
          retention-days: 30
          
