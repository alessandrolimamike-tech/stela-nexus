name: Gerar APK da Stela Nexus
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Pegar os arquivos do projeto
        uses: actions/checkout@v4

      - name: Instalar pacotes do sistema
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y zip openjdk-17-jdk zlib1g-dev libncurses5-dev libtinfo6 cmake libffi-dev libssl-dev autoconf automake libtool pkg-config

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar ferramentas de compilação
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Compilar o APK
        run: buildozer android debug

      - name: Salvar o APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: Stela-Nexus-APK
          path: bin/*.apk
          retention-days: 30
